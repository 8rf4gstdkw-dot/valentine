<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', 'Comic Sans MS', cursive; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e8, #fff6cc);
      overflow: hidden;
      padding: 10px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: popIn 1s ease;
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      color: #ff4d88;
      margin-bottom: 12px;
      font-size: 22px;
    }
    .gallery {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 14px 0;
    }
    .gallery img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 14px;
      border: 3px solid #ffd6e8;
      animation: float 3s ease-in-out infinite;
    }
    .gallery img:nth-child(2) { animation-delay: 1s; }
    .gallery img:nth-child(3) { animation-delay: 2s; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    button {
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #yesBtn {
      background: #ff4d88;
      color: white;
      box-shadow: 0 8px 20px rgba(255,77,136,0.4);
    }
    #yesBtn:active {
      transform: scale(0.95);
    }
    #noBtn {
      background: #eee;
      color: #777;
      position: relative;
    }
    .result {
      margin-top: 22px;
      font-size: 20px;
      color: #ff4d88;
      display: none;
      animation: loveBurst 1s ease forwards;
    }
    @keyframes loveBurst {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }
    .heart {
      position: absolute;
      color: #ff4d88;
      font-size: 22px;
      animation: rise 4s linear infinite;
      opacity: 0;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-600px) scale(1.2); opacity: 0; }
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      h1 { font-size: 20px; }
      .gallery img { width: 80px; height: 80px; }
      button { font-size: 15px; padding: 11px 20px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>

    <div class="gallery">
      <img src="_ (15).jpeg" alt="us" />
      <img src="artist and the muse🙂_↕️.jpeg" alt="us" />
      <img src="us as peanuts characters.jpeg" alt="us" />
    </div>

    <div class="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 🙃👎🏻</button>
    </div>

    <div class="result" id="resultText">Best decision ever!! 💘✨</div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const resultText = document.getElementById('resultText');

    yesBtn.addEventListener('click', () => {
      resultText.style.display = 'block';
      createHearts();
    });

    noBtn.addEventListener('click', () => {
      // Haptic vibration (mobile)
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
      // Move button randomly so it can't be chosen 😈
      const x = Math.random() * 120 - 60;
      const y = Math.random() * 120 - 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function createHearts() {
      for (let i = 0; i < 28; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerText = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '-20px';
        heart.style.animationDuration = 2 + Math.random() * 3 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
      }
    }
  </script>

</body>
</html>
